name: Publish SE-QI Spotlights

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-se-qi-spotlights
  cancel-in-progress: false

jobs:
  check_changes:
    name: Check Smartsheet for website changes
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      gallery_changed: ${{ steps.check.outputs.gallery_changed }}
      ready_count: ${{ steps.check.outputs.ready_count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check publication queue
        id: check
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
        run: node scripts/publish-spotlights.mjs check

  prepare:
    name: Generate and commit approved content
    needs: check_changes
    if: needs.check_changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
      should_publish: ${{ steps.prepare.outputs.should_publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run publishing tests and syntax checks
        run: |
          node --check src/script.js
          node --check scripts/generate-projects-preview.mjs
          node --check scripts/publish-spotlights.mjs
          node scripts/test-publishing-workflow.mjs

      - name: Prepare website content
        id: prepare
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
          PUBLISH_METADATA_PATH: ${{ runner.temp }}/seqi-publish-metadata.json
        run: node scripts/publish-spotlights.mjs prepare

      - name: Configure Git author
        if: steps.prepare.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage approved website files
        id: stage
        if: steps.prepare.outputs.should_publish == 'true'
        run: |
          git add data/projects.json images
          git diff --check
          git diff --cached --check

          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes to commit."
            exit 0
          fi

          unexpected_files="$(printf '%s\n' "$staged_files" | grep -Ev '^(data/projects\.json|images/[^/]+)$' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected staged file(s):"
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit approved website files
        if: steps.prepare.outputs.should_publish == 'true' && steps.stage.outputs.changed == 'true'
        run: git commit -m "Publish approved SE-QI Spotlights"

      - name: Push to main
        if: steps.prepare.outputs.should_publish == 'true' && steps.stage.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Record publication revision
        id: revision
        if: steps.prepare.outputs.should_publish == 'true'
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preserve Smartsheet write-back metadata
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seqi-publish-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/seqi-publish-metadata.json
          if-no-files-found: error
          retention-days: 1

  build_pages:
    name: Build GitHub Pages artifact
    needs: [check_changes, prepare]
    if: needs.check_changes.outputs.should_publish == 'true' && needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out publication revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static website
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          cp index.html dashboard.pdf "${RUNNER_TEMP}/site/"
          cp -R data images src "${RUNNER_TEMP}/site/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy_pages:
    name: Deploy GitHub Pages
    needs: [check_changes, prepare, build_pages]
    if: needs.check_changes.outputs.should_publish == 'true' && needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  writeback:
    name: Mark deployed records as published
    needs: [check_changes, prepare, deploy_pages]
    if: needs.check_changes.outputs.should_publish == 'true' && needs.prepare.outputs.should_publish == 'true' && needs.deploy_pages.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out publication revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore Smartsheet write-back metadata
        uses: actions/download-artifact@v4
        with:
          name: seqi-publish-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/publish-metadata

      - name: Update Smartsheet publication fields
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
          PUBLISH_METADATA_PATH: ${{ runner.temp }}/publish-metadata/seqi-publish-metadata.json
        run: node scripts/publish-spotlights.mjs writeback
