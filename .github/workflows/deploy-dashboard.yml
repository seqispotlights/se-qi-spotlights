name: Deploy Dashboard PDF

on:
  push:
    branches:
      - main
    paths:
      - dashboard.pdf
      - .github/workflows/deploy-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-se-qi-spotlights
  cancel-in-progress: false

jobs:
  build_pages:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble static website
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          cp index.html dashboard.pdf "${RUNNER_TEMP}/site/"
          cp -R data images src "${RUNNER_TEMP}/site/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy_pages:
    name: Deploy GitHub Pages
    needs: build_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
